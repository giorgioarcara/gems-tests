<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="GEMS logo: a hexagonal gem">
  <title>GEMS</title>
  <defs>
    <linearGradient id="g-table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdeee8"/>
    </linearGradient>
    <linearGradient id="g-tl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0d1"/>
      <stop offset="1" stop-color="#2fb19c"/>
    </linearGradient>
    <linearGradient id="g-tr" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c1ff"/>
      <stop offset="1" stop-color="#5b82e0"/>
    </linearGradient>
    <linearGradient id="g-r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d6be0"/>
      <stop offset="1" stop-color="#2b59c3"/>
    </linearGradient>
    <linearGradient id="g-br" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22457f"/>
      <stop offset="1" stop-color="#16325c"/>
    </linearGradient>
    <linearGradient id="g-bl" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d61d6"/>
      <stop offset="1" stop-color="#5338a8"/>
    </linearGradient>
    <linearGradient id="g-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1aa58a"/>
      <stop offset="1" stop-color="#117a65"/>
    </linearGradient>
  </defs>
  <!-- outer hexagon: (50,4) (89.8,27) (89.8,73) (50,96) (10.2,73) (10.2,27)
       table:          (50,24) (68,34.5) (68,55.5) (50,66) (32,55.5) (32,34.5) -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="10.2,27 50,4 50,24 32,34.5" fill="url(#g-tl)"/>
    <polygon points="50,4 89.8,27 68,34.5 50,24" fill="url(#g-tr)"/>
    <polygon points="89.8,27 89.8,73 68,55.5 68,34.5" fill="url(#g-r)"/>
    <polygon points="89.8,73 50,96 50,66 68,55.5" fill="url(#g-br)"/>
    <polygon points="50,96 10.2,73 32,55.5 50,66" fill="url(#g-bl)"/>
    <polygon points="10.2,73 10.2,27 32,34.5 32,55.5" fill="url(#g-l)"/>
    <polygon points="50,24 68,34.5 68,55.5 50,66 32,55.5 32,34.5" fill="url(#g-table)"/>
  </g>
  <!-- sparkle -->
  <path d="M40 33 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z" fill="#ffffff" opacity=".95"/>
</svg>
